[project]
name = "uavlab"
version = "0.1.0"
description = "Control policy experiments on PX4 SITL + Gazebo"
requires-python = ">=3.10"
dependencies = [
    "mavsdk>=2.0,<4",  # v4 is a different (native) API
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uavlab"]
